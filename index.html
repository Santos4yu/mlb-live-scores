<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MLB Live Scores</title>
    <link rel="stylesheet" href="styles.css?v=pitch-card-12">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Main Scores Screen -->
    <div id="app-scores" class="screen active">
        <!-- Top Bar -->
        <header class="top-bar">
            <div class="top-bar-left">
                <div class="avatar-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M5 20c0-4 3.5-7 7-7s7 3 7 7"/></svg>
                </div>
            </div>
            <div class="top-bar-center">
                <div class="sport-pills">
                    <button class="sport-pill active">MLB</button>
                    <button class="sport-pill">FC</button>
                    <button class="sport-pill">WNBA</button>
                    <button class="sport-pill">CWS</button>
                    <button class="sport-pill">Golf</button>
                    <button class="sport-pill">UFC</button>
                    <button class="sport-pill">NFL</button>
                </div>
            </div>
            <div class="top-bar-right">
                <button class="icon-btn" id="themeToggle" onclick="toggleTheme()" title="Toggle dark/light mode">
                    <svg id="themeIconDark" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                    <svg id="themeIconLight" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                </button>
                <button class="icon-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                </button>
                <button class="icon-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
                </button>
            </div>
        </header>

        <!-- Date Picker -->
        <div class="date-picker-container">
            <div class="date-picker" id="datePicker">
                <!-- Generated by JS -->
            </div>
        </div>

        <!-- Games Header -->
        <div class="section-header">
            <h2 class="section-title">Games</h2>
            <div style="display:flex;gap:8px">
                <button class="standings-btn" id="multiWatchBtn" onclick="openMultiWatchSelect()" style="display:none">Multi</button>
                <button class="standings-btn" id="standingsBtn">Standings <span class="arrow">›</span></button>
            </div>
        </div>

        <!-- Games List -->
        <div class="games-list" id="gamesList">
            <!-- Generated by JS -->
        </div>

        <!-- Loading State -->
        <div class="loading-state" id="loadingState" style="display:none;">
            <div class="spinner"></div>
            <p>Loading games...</p>
        </div>

        <!-- Empty State -->
        <div class="empty-state" id="emptyState" style="display:none;">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.5" opacity="0.4">
                <circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/>
            </svg>
            <p>No games scheduled</p>
            <span>Select a different date or check back later</span>
        </div>

        <div class="official-data">
            <span>Official MLB Data</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="var(--accent)"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
        </div>
    </div>

    <!-- Standings Screen -->
    <div id="app-standings" class="screen">
        <header class="top-bar">
            <div class="top-bar-left">
                <button class="back-btn" onclick="showScores()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
                </button>
            </div>
            <div class="top-bar-center"><h1 class="page-title">Standings</h1></div>
            <div class="top-bar-right"></div>
        </header>
        <div class="standings-content" id="standingsContent">
            <!-- Generated by JS -->
        </div>
    </div>

    <!-- Game Center Screen -->
    <div id="app-gamecenter" class="screen">
        <header class="gc-header" id="gcHeader">
            <!-- Generated by JS -->
        </header>
        <div class="gc-tabs" id="gcTabs">
            <!-- Generated by JS -->
        </div>
        <div id="gameAlertToastRegion" class="game-alert-toast-region" aria-live="polite" aria-atomic="true"></div>
        <div class="gc-content" id="gcContent">
            <!-- Generated by JS -->
        </div>
    </div>

    <!-- Multi-Watch Screen -->
    <div id="app-multiwatch" class="screen">
        <header class="top-bar">
            <div class="top-bar-left">
                <button class="back-btn" onclick="closeMultiWatch()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
                </button>
            </div>
            <div class="top-bar-center"><h1 class="page-title">Multi-Watch</h1></div>
            <div class="top-bar-right"></div>
        </header>
        <div class="multiwatch-grid" id="multiwatchGrid">
            <!-- Generated by JS -->
        </div>
    </div>

    <script src="app.js?v=game-order-10"></script>
</body>
</html>
